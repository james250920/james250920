<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="Sobre Mí">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#62ff60" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#315c38"/>
      <stop offset="1" stop-color="#1c3b2b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" x2="1">
      <stop offset="0" stop-color="#62ff60" stop-opacity="0"/>
      <stop offset=".5" stop-color="#b8ffb0"/>
      <stop offset="1" stop-color="#62ff60" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>text { font-family: ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }</style>
  <text x="2" y="30" font-size="13" font-weight="700" fill="#9faeaa" letter-spacing="2">// 01</text>
  <text x="62" y="31" font-size="22" font-weight="800" fill="#62ff60" letter-spacing="3" filter="url(#glow)">SOBRE MÍ</text>
  <rect x="199" y="13" width="12" height="20" fill="#62ff60" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="50" width="900" height="2" fill="url(#rail)"/>
  <rect x="-160" y="48" width="160" height="6" fill="url(#pulse)" filter="url(#glow)">
    <animate attributeName="x" values="-160;900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
