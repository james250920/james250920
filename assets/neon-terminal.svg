<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="MENFROYT — software developer">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="neon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c6ffb0"/><stop offset=".5" stop-color="#7dff6a"/><stop offset="1" stop-color="#3fe07a"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#12301e"/><stop offset=".5" stop-color="#07110d"/><stop offset="1" stop-color="#030705"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#63e773" stroke-opacity=".07"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity=".35"/>
    </pattern>
    <linearGradient id="sweep" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#62ff60" stop-opacity="0"/>
      <stop offset=".5" stop-color="#62ff60" stop-opacity=".10"/>
      <stop offset="1" stop-color="#62ff60" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel"><rect x="1" y="1" width="898" height="328" rx="16"/></clipPath>
    <clipPath id="typed">
      <rect x="232" y="234" height="22" width="0">
        <animate attributeName="width" values="0;0;9;18;27;36;45;54;54;54" keyTimes="0.0000;0.0800;0.0940;0.1080;0.1220;0.1360;0.1500;0.1640;0.2300;1.0000" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace,SFMono-Regular,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; }
    .chip { font-size: 10px; font-weight: 700; letter-spacing: .12em; }
  </style>

  <g clip-path="url(#panel)">
    <rect width="900" height="330" fill="url(#bg)"/>
    <rect width="900" height="330" fill="url(#grid)"/>

    <!-- Logo ASCII con brillo neón y parpadeo de tubo -->
    <g fill="url(#neon)" font-weight="700" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;.35;1;.7;1;1" keyTimes="0;.62;.64;.66;.68;.70;1" dur="6s" repeatCount="indefinite"/>
      <text x="126.0" y="92" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-size="15"> __  __   ______   _   _   ______   _____     ____   __     __  _______ </text>
      <text x="126.0" y="111" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-size="15">|  \/  | |  ____| | \ | | |  ____| |  __ \   / __ \  \ \   / / |__   __|</text>
      <text x="126.0" y="130" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-size="15">| \  / | | |__    |  \| | | |__    | |__) | | |  | |  \ \_/ /     | |   </text>
      <text x="126.0" y="149" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-size="15">| |\/| | |  __|   | . ` | |  __|   |  _  /  | |  | |   \   /      | |   </text>
      <text x="126.0" y="168" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-size="15">| |  | | | |____  | |\  | | |      | | \ \  | |__| |    | |       | |   </text>
      <text x="126.0" y="187" textLength="648" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-size="15">|_|  |_| |______| |_| \_| |_|      |_|  \_\  \____/     |_|       |_|   </text>
    </g>

    <line x1="70" x2="830" y1="212" y2="212" stroke="#1c3b2b"/>

    <!-- Terminal -->
    <g font-size="15">
      <text x="70" y="250" textLength="162" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#62ff60">james@menfroyt:~$ </text>
      <g clip-path="url(#typed)"><text x="232" y="250" textLength="54" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#e8f4ed">whoami</text></g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" keyTimes="0;0.2300" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
        <text x="70" y="276" textLength="387" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#aaff9f">software developer · .net · angular · cloud</text>
        <text x="70" y="302" textLength="162" lengthAdjust="spacingAndGlyphs" xml:space="preserve" fill="#62ff60">james@menfroyt:~$ </text>
      </g>
      <rect x="232" y="237" width="9" height="16" fill="#62ff60">
        <animate attributeName="x" values="232;232;241;250;259;268;277;286;232;232" keyTimes="0.0000;0.0800;0.0940;0.1080;0.1220;0.1360;0.1500;0.1640;0.2300;1.0000" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
        <animate attributeName="y" values="237;237;237;237;237;237;237;237;289;289" keyTimes="0.0000;0.0800;0.0940;0.1080;0.1220;0.1360;0.1500;0.1640;0.2300;1.0000" dur="10s" calcMode="discrete" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Chips de las esquinas, como en el HTML -->
    <g class="chip">
      <rect x="17" y="17" width="172" height="28" rx="6" fill="#06130d" fill-opacity=".86" stroke="#4f9b56" stroke-opacity=".45"/>
      <circle cx="33" cy="31" r="3.5" fill="#62ff60">
        <animate attributeName="opacity" values="1;.35;1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="35" fill="#aaff9f">FLUID SIMULATION</text>
      <rect x="749" y="285" width="134" height="28" rx="6" fill="#06130d" fill-opacity=".86" stroke="#4f9b56" stroke-opacity=".45"/>
      <text x="760" y="303" fill="#b3caba">TUX.EXE / 001</text>
    </g>

    <!-- Scanlines y barrido de luz -->
    <rect width="900" height="330" fill="url(#scan)" opacity=".3"/>
    <rect x="0" y="-120" width="900" height="120" fill="url(#sweep)">
      <animate attributeName="y" values="-120;330" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="898" height="328" rx="16" fill="none" stroke="#315c38"/>
</svg>
